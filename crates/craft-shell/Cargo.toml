[package]
name = "craft-shell"
description = "Application chrome: app bar, ribbon, panels, command palette, preferences, keymap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
craft-theme.workspace = true
craft-i18n.workspace = true
craft-ui.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
web-time.workspace = true
craft-docpath.workspace = true
craft-quit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-platform = { workspace = true, features = ["appearance"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
craft-platform = { workspace = true, features = ["browser"] }

[lints]
workspace = true
