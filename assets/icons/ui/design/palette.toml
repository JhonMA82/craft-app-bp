# Icon colour roles. Artwork in svg/ uses the stable source hex values below (or `currentColor`
# for the `line` role); the build maps each identifier to its role and the app resolves the role to
# the value for the active theme. `source` is the stable SVG identifier; edit only light/dark
# display values or accent ramps to recolour finished artwork without modifying SVGs.
#
# Adapted from SolidCraft (assets/icons/ui/design/palette.toml), MIT OR Apache-2.0. The CAD
# accents (surface/form/mesh/sketch/constraint/construction) were replaced by the shell's seven
# accent families. See ATTRIBUTION.md.

[roles.ink]        # outlines and details drawn over a face
source = "#34465b"
light = "#34465b"
dark = "#1f2021"
[roles.line]       # line art that sits directly on the UI background (SVG: currentColor)
source = "#34465b"
light = "#34465b"
dark = "#dbe4ee"
[roles.passive-1]  # passive geometry, lightest face
source = "#e2e8ef"
light = "#e2e8ef"
dark = "#8da3c3"
[roles.passive-2]
source = "#b8c3cf"
light = "#b8c3cf"
dark = "#6d81a2"
[roles.passive-3]  # darkest passive face
source = "#8e9faf"
light = "#8e9faf"
dark = "#546782"
[roles.gap]        # erases earlier artwork to transparency
source = "#ffffff"
light = "#ffffff"
dark = "#1e2530"
[roles.guide]      # construction and guide dots
source = "#6f879c"
light = "#6f879c"
dark = "#8093a4"
[roles.active-1]   # changed or result geometry, palest face
source = "#b9ddf8"
light = "#b9ddf8"
dark = "#4ea1dc"
[roles.active-2]
source = "#328bd3"
light = "#328bd3"
dark = "#3287d1"
[roles.active-3]   # strongest blue: strokes and accents
source = "#236ead"
light = "#236ead"
dark = "#2976b8"

[strokes]          # on the 64 grid
geometry = 2.55
action = 4.25
navigation = 5.6
parameters = 4.2

# Accent colours. An accent replaces the roles it lists (normally the three `active-*` blues), so
# an icon keeps its drawing and only changes colour. Roles an accent does not list keep their base
# value. `icon-accents` maps an icon id to its default accent.

[accents.blue.active-1]
light = "#b9ddf8"
dark = "#4ea1dc"
[accents.blue.active-2]
light = "#328bd3"
dark = "#3287d1"
[accents.blue.active-3]
